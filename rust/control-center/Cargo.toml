[package]
name = "churros-control-center"
version = "1.2.0"
edition = "2024"

[package.metadata.churros]
# Port completo: build-rust.sh despliega el binario en la ISO
# (reemplaza al wrapper churros-control-center y al Python de control-center/).
deploy = true

[dependencies]
churros-services = { path = "../services" }
gio = "0.22.8"
glib = "0.22.8"
gtk = { version = "0.11.4", package = "gtk4", features = ["v4_18"] }