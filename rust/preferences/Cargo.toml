[package]
name = "churros-settings"
version = "1.2.0"
edition = "2024"
description = "ChurrOS Preferences (centro de configuración) — port Rust de preferences/"

[package.metadata.churros]
# Port completo: build-rust.sh despliega el binario en la ISO.
deploy = true

[dependencies]
adw = { version = "0.9.2", package = "libadwaita" }
churros-services = { path = "../services" }
gio = "0.22.8"
glib = "0.22.8"
gtk = { version = "0.11.4", package = "gtk4", features = ["v4_18"] }
serde_json = "1"
tar = "0.4.46"
zstd = "0.13"
libc = "0.2"
