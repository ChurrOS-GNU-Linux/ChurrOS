[workspace]
resolver = "2"
members = ["churros-welcome", "churros-tour", "preferences", "services", "popups", "control-center"]

[workspace.package]
version = "1.2.0"
edition = "2024"
license = "GPL-3.0-only"

[profile.release]
lto = false  # LTO thin encarece mucho la build; la ganancia runtime es marginal para apps GTK
codegen-units = 16
panic = "abort"
strip = true
opt-level = 3
