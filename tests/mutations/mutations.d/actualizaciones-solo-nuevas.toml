[[mutation]]
name = "churros-update-utils: vuelve a instalar cualquier versión distinta (también más antigua)"
file = "archiso/airootfs/usr/bin/churros-update-utils"
find = '    if [ -n "$installed" ] && ! version_gt "$version" "$installed"; then'
replace = '    if false; then'
caught_by = "python3 scripts/test-privileged-helpers.py UpdatesOnlyNewerAndSnapshot"
expect = "[updates-only-newer]"
why = "Un updates.json viejo con su firma válida, o la copia caducada de una caché, bajaba de versión."

[[mutation]]
name = "churros-update-utils: compara versiones como texto"
file = "archiso/airootfs/usr/bin/churros-update-utils"
find = "sort -V | tail -n 1)\" = \"$1\" ]"
replace = "sort | tail -n 1)\" = \"$1\" ]"
caught_by = "python3 scripts/test-privileged-helpers.py UpdatesOnlyNewerAndSnapshot"
expect = "[updates-only-newer]"
why = "Como texto 1.5.10 es menor que 1.5.9: la 1.5.10 no se instalaría nunca."

[[mutation]]
name = "churros-update-utils: instala el bundle sin snapshot previo"
file = "archiso/airootfs/usr/bin/churros-update-utils"
find = "    snapshot_before_bundle \"$version\"\n"
replace = ""
caught_by = "python3 scripts/test-privileged-helpers.py UpdatesOnlyNewerAndSnapshot"
expect = "[snapshot-before-bundle]"
why = "El hook de pacman no cubre el bundle: si rompe algo no hay a dónde volver."

[[mutation]]
name = "churros-update-utils: sigue aunque falle el snapshot previo"
file = "archiso/airootfs/usr/bin/churros-update-utils"
find = '        || die "no se pudo crear el snapshot previo; no se ha instalado nada'
replace = '        || echo "no se pudo crear el snapshot previo; no se ha instalado nada'
caught_by = "python3 scripts/test-privileged-helpers.py UpdatesOnlyNewerAndSnapshot"
expect = "[snapshot-before-bundle]"
why = "En btrfs instalaría sin punto de vuelta diciendo que no ha instalado nada."

[[mutation]]
name = "churros-update-auto: avisa de una versión más antigua"
file = "archiso/airootfs/usr/local/bin/churros-update-auto"
find = ' && [ "$newest" = "$available" ]; then'
replace = '; then'
caught_by = "python3 scripts/test-privileged-helpers.py UpdateTimerOnlyNotifies"
expect = "[updates-only-newer]"
why = "Una copia vieja del manifiesto anunciaría «Hay actualizaciones» que el actualizador no instala."

[[mutation]]
name = "churros-settings: ofrece cualquier versión distinta de las utilidades"
file = "rust/preferences/src/services/update.rs"
find = "            r > i\n"
replace = "            r != i\n"
caught_by = "cargo test --offline --locked --manifest-path rust/Cargo.toml -p churros-settings only_a_newer_churros_version_is_offered"
requires = "container"
expect = "[updates-only-newer]"
why = "Ajustes ofrecería bajar de versión y el actualizador no la instalaría."
