[[mutation]]
name = "test-gui-smoke: el popup de red entra en pánico al abrirse (borrow_mut vivo durante repaint)"
file = "rust/popups/src/network.rs"
find = '''            move |info| {
                *w.last.borrow_mut() = info;
                w.sync_switch();
                w.repaint();
            },'''
replace = '''            move |info| {
                let mut last = w.last.borrow_mut();
                *last = info;
                w.sync_switch();
                w.repaint();
            },'''

caught_by = "python3 scripts/test-gui-smoke.py -k 'churros-popup network'"
expect = "FALLO churros-popup network"
requires = "container"
why = "El RefMut vive hasta el final de reload() y el self.last.borrow() de unas líneas más abajo aborta el popup: compila y ninguna otra capa ejecuta los popups."

