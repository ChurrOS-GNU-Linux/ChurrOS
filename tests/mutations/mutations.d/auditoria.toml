# --- auditoría R3: un config de fastfetch corrupto no puede tumbar la app ---

[[mutation]]
name = "fastfetch: read_config deja pasar una raíz que no es objeto"
file = "rust/preferences/src/services/fastfetch_config.rs"
find = "churros_services::nested::as_object(parsed)"
replace = "parsed"
caught_by = "tests.static.test_fastfetch_config_safety"
expect = "[fastfetch:root-normalized]"
why = "Con `[]` o `\"x\"` como raíz, el primer setter hace as_object_mut().unwrap() y, con panic=abort, mata churros-settings."

[[mutation]]
name = "fastfetch: los setters vuelven a usar as_object_mut().unwrap()"
file = "rust/preferences/src/services/fastfetch_config.rs"
find = """
    pub fn set_logo_colors(colors: &[String; 4]) {
        let mut cfg = read_config();
        let obj = object_at(&mut cfg, &["logo"]);"""
replace = """
    pub fn set_logo_colors(colors: &[String; 4]) {
        let mut cfg = read_config();
        let obj = cfg.as_object_mut().unwrap();"""
