# Regresiones sembradas: cada una tiene que hacer fallar la prueba `caught_by`
# con `expect` en la salida. Las ejecuta tests/mutations/run_mutations.py
# (./churros test --mutations; CI: job "mutations" de ci.yml).
#
# Son cambios dañinos y realistas, del tipo que entra con un cambio generado
# sin revisar: quitar un paquete "que no se usa", perder un permiso, mover un
# paso de Calamares, una errata en un script que solo corre al arrancar o al
# instalar, desactivar una prueba para que el CI pase.
#
# Al arreglar un fallo, añade aquí la mutación que lo reproduce. Si una
# mutación queda obsoleta porque el fichero cambió ('find' ya no aparece una
# sola vez), actualízala para que siga describiendo la misma regresión; no la
# borres sin sustituirla.


# --- shell_perms ---

[[mutation]]
name = "test_file_permissions: The entry for churros-niri-session is deleted"
file = "archiso/profiledef.sh"
find = "  [\"/usr/bin/churros-niri-session\"]=\"0:0:755\"\n"
replace = ""
caught_by = "tests.static.test_file_permissions"
expect = "[exec-mode:/usr/bin/churros-niri-session]"
why = "The entry for churros-niri-session is deleted. The file is 100644 in git, so it ships 0644 and the installed greetd session fails with Permission denied."

[[mutation]]
name = "test_file_permissions: The mode is changed to 0"
file = "archiso/profiledef.sh"
find = "[\"/usr/local/bin/churros-write-root-config\"]=\"0:0:755\""
replace = "[\"/usr/local/bin/churros-write-root-config\"]=\"0:0:644\""
caught_by = "tests.static.test_file_permissions"
expect = "[exec-mode:/usr/local/bin/churros-write-root-config]"
why = "The mode is changed to 0:0:644, so pkexec of the root-config helper fails with permission denied."

[[mutation]]
name = "test_file_permissions: A typo in an entry key (same effect as adding a script without an entry)"
file = "archiso/profiledef.sh"
find = "[\"/usr/share/churros/scripts/verify-install\"]"
replace = "[\"/usr/share/churros/scripts/verify-instal\"]"
caught_by = "tests.static.test_file_permissions"
expect = "[stale-permission:/usr/share/churros/scripts/verify-instal]"
why = "A typo in an entry key (same effect as adding a script without an entry): the real script ships 0644 and the '-' prefix in shellprocess hides the failure. exec-mode:/usr/share/churros/scripts/verify-install also fires."

