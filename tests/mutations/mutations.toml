why = "form_values must give every control the value of an empty form when the rule does not have it (the old on_edit_rule left the opacity of the rule edited before, so pavucontrol got `opacity 0.8` from foot). unwrap_or_default() gives 0: saving pavucontrol would write `opacity 0.0`, an invisible window. niri validate accepts it."

