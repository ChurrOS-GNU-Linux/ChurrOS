[[issue]]
id = "edition-pkg:pi/aarch64:polkit-qt6"
note = "La edición pi integra Calamares (build.sh lo hace en toda arquitectura salvo i686) y customize_airootfs.sh lo desempaqueta con bsdtar, sin resolver dependencias. archiso/packages.pi.aarch64 no trae polkit-qt6 y tampoco le llega como dependencia (pacman -Sp de la lista contra Arch Linux ARM), así que /usr/local/bin/calamares encuentra librerías sin resolver (ldd) y el instalador no arranca en la Live pi. Arreglo: copiar a packages.pi.aarch64 el bloque de dependencias de Calamares que ya tiene packages.aarch64."

