# Problemas reales que las pruebas detectan hoy y todavía no están arreglados.
#
# Cada entrada silencia un hallazgo concreto (su `id` lo imprime la prueba
# entre corchetes). No es un sitio para esconder fallos nuevos:
#   - Añadir una entrada exige explicar en `note` qué falla y por qué no se
#     arregla en el mismo cambio. Revisa quién lo añade (CODEOWNERS).
#   - Cuando se arregla, la prueba falla hasta que se borra su entrada: la
#     lista solo puede acortarse.
#
# Formato:
#   [[issue]]
#   id = "categoria:detalle"
#   note = "qué falla, consecuencia y dónde"

# --- test_file_permissions ---

# --- tests/static/test_release_bundle.py ---

[[issue]]
id = "release:manifest:files:updates.json"
note = "build-churros-release.sh x86_64 copia release/x86_64/updates.json a release/updates.json («alias para clientes antiguos»), pero los bundles que nombra se quedan en release/x86_64/. churros-update-utils descarga ${BASE}<file> del mismo directorio que ${BASE}updates.json: si se publica release/ tal cual en download.churroslinux.org/churros/, todas las instalaciones fallan con 'descarga fallida' (404). Solo funciona si alguien copia a mano los bundles x86_64 a la raíz, y entonces aarch64/i686 reciben x86_64 (release:client:arch:*)."

[[issue]]
id = "release:bundle-elf:aarch64"
note = "build-churros-release.sh aarch64 solo usa la arquitectura para nombrar el bundle: `cargo build --release` va sin --target, compila para el equipo que publica y el script copia rust/target/release/*. churros-utils-*-aarch64.tar.zst lleva binarios x86_64 (o los de la máquina donde se genere)."

[[issue]]
id = "release:bundle-elf:i686"
note = "build-churros-release.sh i686 solo usa la arquitectura para nombrar el bundle: `cargo build --release` va sin --target, compila para el equipo que publica y el script copia rust/target/release/*. churros-utils-*-i686.tar.zst lleva binarios x86_64 (o los de la máquina donde se genere)."

[[issue]]
id = "release:client:arch:aarch64"
note = "churros-update-utils no mira la arquitectura: descarga siempre ${BASE}updates.json (el alias x86_64 que deja build-churros-release.sh), ignora su campo 'arch' y validate_tarball no comprueba la máquina ELF. Una instalación aarch64 que use «Actualizar utilidades» de Ajustes o churros-update-auto instala churros-settings, churros-welcome... x86_64 en /usr/bin y las apps dejan de arrancar (Exec format error). aa8a233 leía ${BASE}${ARCH}/updates.json y comprobaba 'arch'; el cliente actual ya no."

[[issue]]
id = "release:client:arch:i686"
note = "churros-update-utils no mira la arquitectura: descarga siempre ${BASE}updates.json (el alias x86_64 que deja build-churros-release.sh), ignora su campo 'arch' y validate_tarball no comprueba la máquina ELF. Una instalación i686 que use «Actualizar utilidades» de Ajustes o churros-update-auto instala churros-settings, churros-welcome... x86_64 en /usr/bin y las apps dejan de arrancar (Exec format error)."

[[issue]]
id = "release:assets:churros-welcome"
note = "build-churros-release.sh copia archiso/airootfs/usr/share/churros tal cual está en disco. usr/share/churros/churros-welcome/ (donde la app lee sus assets) está en .gitignore y solo lo llena build-rust.sh durante un build de ISO (el trap no lo borra): una release desde un clon limpio sale sin los assets, y desde un árbol con un build anterior lleva los de ese build, quizá viejos. Iconos y CSS nuevos no llegan a las instalaciones."

[[issue]]
id = "release:assets:churros-settings"
note = "build-churros-release.sh copia archiso/airootfs/usr/share/churros tal cual está en disco. usr/share/churros/churros-settings/ (donde Ajustes lee sus assets) está en .gitignore y solo lo llena build-rust.sh durante un build de ISO (el trap no lo borra): una release desde un clon limpio sale sin los assets, y desde un árbol con un build anterior lleva los de ese build, quizá viejos. Iconos y CSS nuevos no llegan a las instalaciones."

[[issue]]
id = "release:assets:churros-popup"
note = "build-churros-release.sh copia archiso/airootfs/usr/share/churros tal cual está en disco. usr/share/churros/churros-popup/ (donde los popups leen su CSS) está en .gitignore y solo lo llena build-rust.sh durante un build de ISO (el trap no lo borra): una release desde un clon limpio sale sin los assets, y desde un árbol con un build anterior lleva los de ese build, quizá viejos."

[[issue]]
id = "release:assets:churros-control-center"
note = "build-churros-release.sh copia archiso/airootfs/usr/share/churros tal cual está en disco. usr/share/churros/churros-control-center/ (donde el control center lee iconos y style.css) está en .gitignore y solo lo llena build-rust.sh durante un build de ISO (el trap no lo borra): una release desde un clon limpio sale sin los assets, y desde un árbol con un build anterior lleva los de ese build, quizá viejos. El usr/share/churros/control-center/ versionado no lo lee nadie."

[[issue]]
id = "release:bundle:mode:usr/share/churros/scripts/configure-greeter-locale"
note = "Está en git con modo 644 y profiledef.sh le da 755 en la ISO. El bundle lleva el modo de git e install_stage lo instala 0644: tras una actualización OTA deja de ser ejecutable. Impacto bajo hoy (solo lo ejecuta Calamares desde la ISO, shellprocess-cleanup.conf); se arregla con git update-index --chmod=+x."

[[issue]]
id = "release:cargo-target-dir:stale-binaries"
note = "build-churros-release.sh busca los binarios en rust/target/release aunque CARGO_TARGET_DIR (lo exporta scripts/lib/container.sh; build-rust.sh sí lo respeta) mande la compilación a otro directorio, y `[ -x \"$binary\" ]` salta sin error lo que no encuentra: el bundle sale con los binarios de una compilación anterior, o sin ellos, y el script dice «listo»."

[[issue]]
id = "release:signing:unsigned-manifest"
note = "No hay /usr/share/churros/churros-release.pubkey en el airootfs ni en el bundle, build-churros-release.sh no firma y minisign no está en ninguna lista de paquetes (TODO #139, #141 en churros-update-utils). verify_manifest solo avisa por stdout y sigue: quien controle lo que sirve download.churroslinux.org/churros/ instala ficheros como root en /usr/bin de todas las instalaciones, porque el sha256 del bundle viene del mismo manifiesto sin autenticar."

# --- test_calamares_config ---
[[issue]]
id = "calamares-sequence:ignored-conf:modules/hwclock.conf"
note = "hwclock es noconfig en Calamares 3.4.2 (src/modules/hwclock/module.desc): installer/calamares/modules/hwclock.conf no se lee nunca y el módulo siempre corre hwclock --systohc --utc. Fichero muerto que hace creer que se configura algo. Arreglo: borrarlo."

[[issue]]
id = "calamares-sequence:ignored-conf:modules/localecfg.conf"
note = "localecfg es noconfig en Calamares 3.4.2: installer/calamares/modules/localecfg.conf (region, zone, defaultLanguage) no se lee nunca; localecfg usa lo que se eligió en la página locale. Arreglo: borrarlo (los valores por defecto van en locale.conf)."

[[issue]]
id = "calamares-sequence:ignored-conf:modules/networkcfg.conf"
note = "networkcfg es noconfig en Calamares 3.4.2: installer/calamares/modules/networkcfg.conf (replaceHosts, preferGeoIP) no se lee nunca, y esas claves no existen en networkcfg. Arreglo: borrarlo."

[[issue]]
id = "calamares-sequence:initcpiocfg-overwrites:modules/shellprocess-fixboot.conf"
note = "fix-boot añade virtio-gpu vmwgfx bochs-drm qxl a MODULES de /etc/mkinitcpio.conf, pero initcpiocfg corre después y reescribe la línea con MODULES=() a partir del mkinitcpio.conf del Live (src/modules/initcpiocfg/main.py, write_mkinitcpio_lines). El sed no llega al sistema instalado. Arreglo: moverlo a un shellprocess entre initcpiocfg e initcpio, o quitarlo (el hook kms ya mete los drivers DRM)."

[[issue]]
id = "calamares-sequence:initcpiocfg-overwrites:modules/aarch64/shellprocess-fixboot.conf"
note = "Igual que en modules/shellprocess-fixboot.conf: los módulos virtio_* que aarch64/shellprocess-fixboot.conf añade a MODULES se pierden porque initcpiocfg reescribe esa línea después."

[[issue]]
id = "calamares-sequence:initcpiocfg-overwrites:modules/i686/shellprocess-fixboot.conf"
note = "Igual que en modules/shellprocess-fixboot.conf (la copia i686; hoy i686 se construye sin Calamares)."

[[issue]]
id = "calamares-sim:fix-boot:aarch64:command-fails:publish-aarch64-kernel"
note = "fix-boot en aarch64 termina con '/usr/share/churros/scripts/publish-aarch64-kernel --require' (sin '-'), que exige /boot/Image en el destino. mkarchiso vacía /boot del squashfs (_cleanup_pacstrap_dir) y modules/aarch64/unpackfs.conf solo copia vmlinuz-linux-aarch64 e initramfs-linux-aarch64.img, así que el comando sale con 1 y la instalación aarch64 se aborta en fix-boot. Arreglo: copiar también el kernel del ISO a /boot/Image en aarch64/unpackfs.conf, o no usar --require en el destino."

[[issue]]
id = "calamares-sim:fix-boot:aarch64:kver-missing:linux-aarch64.preset"
note = "Mismo origen: el preset instalado deja ALL_kver='/boot/Image', que no existe en el destino. Aunque fix-boot pasara, 'mkinitcpio -P' (paso initcpio) saldría con 'specified kernel image does not exist'. Arreglo: el de calamares-sim:fix-boot:aarch64:command-fails, o ALL_kver='/boot/vmlinuz-linux-aarch64' en el sistema instalado."


[[issue]]
id = "calamares-sim:fix-boot:x86_64:image:linux-cachyos.preset"
note = "Mismo origen: tras fix-boot el preset de linux-cachyos genera /boot/initramfs-linux-cachyos.img, pero GRUB arranca /boot/initramfs-linux.img (el de unpackfs, copiado del ISO con los hooks de archiso; lo regenera linux.preset)."

[[issue]]
id = "calamares-xref:initcpio-hook:plymouth:pi/aarch64"
note = "installer/calamares/modules/initcpiocfg.conf antepone el hook plymouth, pero archiso/packages.pi.aarch64 no instala plymouth: mkinitcpio sale con 1 ('Hook plymouth cannot be found') y el paso initcpio aborta la instalación de la edición pi. Arreglo: añadir plymouth a la lista pi, o quitar el prepend (initcpiocfg ya añade plymouth solo cuando está instalado)."

[[issue]]
id = "calamares-xref:users-shell:pi/aarch64"
note = "installer/calamares/modules/users.conf crea la cuenta con shell /bin/zsh y archiso/packages.pi.aarch64 no incluye zsh: el único usuario de una instalación pi no puede iniciar sesión. Arreglo: añadir zsh a la lista pi."

[[issue]]
id = "calamares-xref:sudo:pi/aarch64"
note = "users.conf mete al usuario en wheel (sudoersGroup) y Calamares escribe /etc/sudoers.d/10-installer, pero archiso/packages.pi.aarch64 no instala sudo: el usuario de la edición pi no tiene sudo. Arreglo: añadir sudo a la lista pi."

# --- test_references ---
[[issue]]
id = "ref:niri/i686:scripts/cli/build.sh:initial_session:niri"
note = "La ISO i686 arranca greetd con [initial_session] command = \"niri\" (SESSION_CMD de scripts/cli/build.sh), pero archlinux32 no empaqueta niri y packages.i686 no lo lista (lo dice su cabecera): la sesión Live autologin falla y la edición por defecto i686 no tiene escritorio."

[[issue]]
id = "ref:pi/aarch64:archiso/airootfs/etc/passwd:/usr/bin/zsh"
note = "etc/passwd da a root la shell /usr/bin/zsh, pero packages.pi.aarch64 no trae zsh (ni llega como dependencia): en la ISO Pi el login de root en otra consola o por serie no tiene shell (y root/.zlogin, el respaldo que arranca greetd, nunca se ejecuta)."

[[issue]]
id = "ref:pi/aarch64:archiso/airootfs/root/scripts/users.sh:/bin/zsh"
note = "users.sh crea el usuario Live churros con -s /bin/zsh y packages.pi.aarch64 no trae zsh: en la ISO Pi churros queda con una shell que no existe (login en consola, su, terminal)."

[[issue]]
id = "ref:pi/aarch64:installer/calamares/modules/users.conf:/bin/zsh"
note = "Calamares (users.conf user.shell) crea el usuario del sistema instalado con /bin/zsh, que no está en packages.pi.aarch64: en la Pi instalada el usuario no puede entrar por consola ni SSH."

[[issue]]
id = "ref:pi/aarch64:archiso/airootfs/etc/xdg/labwc/rc.xml:foot"
note = "rc.xml de labwc lanza foot con W-Return y desde el menú raíz, pero packages.pi.aarch64 solo trae foot-terminfo: en la edición Pi el atajo y la entrada Terminal no hacen nada."

[[issue]]
id = "ref:pi/aarch64:archiso/airootfs/etc/xdg/labwc/menu.xml:foot"
note = "menu.xml de labwc tiene la entrada Terminal con foot, que no está en packages.pi.aarch64 (solo foot-terminfo): la entrada no hace nada."

[[issue]]
id = "ref:pi/aarch64:archiso/airootfs/usr/share/churros/pi/waybar/config.jsonc:foot"
note = "La waybar de Pi abre foot con clic derecho en custom/launcher, pero packages.pi.aarch64 solo trae foot-terminfo: el clic no hace nada."

[[issue]]
id = "ref:server/x86_64:archiso/airootfs/etc/skel/.config/xfce4/panel/launcher-10/10.desktop:firefox"
note = "El panel XFCE (plugin-10 de xfce4-panel.xml) tiene un lanzador de Firefox, pero packages.server.x86_64 no trae firefox: en la sesión Live de la ISO server el botón no hace nada."

# --- test_rust_contract ---
[[issue]]
id = "deploy:gitignore:churros-tour"
note = ".gitignore lista los binarios y assets que scripts/build-rust.sh escribe en archiso/airootfs para welcome, settings, popup y control-center, pero no archiso/airootfs/usr/bin/churros-tour ni archiso/airootfs/usr/share/churros/churros-tour/. Por eso los assets del tour están versionados (una copia de rust/churros-tour/assets que cada build sobrescribe y que se queda vieja en cuanto cambie el crate) y el binario aparece en git status si un build no llega al trap. Arreglo: añadir las dos rutas a .gitignore y `git rm -r --cached archiso/airootfs/usr/share/churros/churros-tour`."

[[issue]]
id = "deploy:clean:churros-tour"
note = "scripts/cli/clean.sh (./churros clean) borra los binarios Rust generados uno a uno y le falta archiso/airootfs/usr/bin/churros-tour (el trap de build.sh sí lo borra): tras un build cortado antes del trap, clean no lo quita y, como tampoco está en .gitignore, queda un ELF sin versionar en el árbol. Arreglo: añadir `rm -f archiso/airootfs/usr/bin/churros-tour` a clean.sh (mejor: recorrer los crates con deploy = true)."

