[[issue]]
id = "kernel:packages.i686:linux-churrosvyper"
note = "archiso/airootfs/etc/mkinitcpio.d/linux-churrosvyper.preset está en el airootfs común, pero archiso/packages.i686 no instala linux-churrosvyper (solo packages.x86_64 lo trae). initcpio.conf usa kernel: all (mkinitcpio -P), que recorre todos los presets: el de linux-churrosvyper apunta a /boot/vmlinuz-linux-churrosvyper, que no existe, y mkinitcpio -P falla, con él la instalación. Decidir dónde vive el preset (solo con el paquete, o que build.sh lo quite en las ediciones sin ese kernel)."

