[[issue]]
id = "boot-server-x86_64:coredump:light-locker"
note = "En la sesión Live de server (CI, UEFI y BIOS con KVM) light-locker aborta al arrancar la sesión: SIGABRT en dbus_message_append_args (libdbus) con un argumento NULL. light-locker solo funciona con LightDM (pide la sesión por XDG_SESSION_PATH) y ChurrOS usa greetd, así que nunca bloqueó la pantalla. Decidir el bloqueador (xfce4-screensaver, que xflock4 ya usa si está) y quitar light-locker de la lista."

[[issue]]
id = "boot-xfce-x86_64:coredump:light-locker"
note = "Misma causa que boot-server-x86_64:coredump:light-locker (misma sesión XFCE con greetd): en la sesión Live de XFCE (CI, UEFI y BIOS con KVM) light-locker aborta al arrancar con SIGABRT en dbus_message_append_args: necesita LightDM. Decidir el bloqueador (xfce4-screensaver) y quitar light-locker de la lista."
