note = "/usr/lib/libcalamaresui.so.3.4.2 necesita libQt6Svg.so.6, que no está en la ISO. customize_airootfs.sh desempaqueta Calamares con bsdtar y pacman nunca resuelve sus dependencias; packages.server.x86_64 no tiene el bloque 'Calamares installer dependencies' de packages.x86_64 (yaml-cpp, kpmcore, qt6-declarative, qt6-svg...). Calamares no arranca: la edición server no se puede instalar. Mismo fallo que edition-pkg:server/x86_64:*."

