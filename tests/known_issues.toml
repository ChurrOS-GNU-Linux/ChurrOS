[[issue]]
id = "edition-pkg:pi/aarch64:plymouth"
note = "installer/calamares/modules/initcpiocfg.conf antepone el hook 'plymouth' en todas las ediciones con instalador, pero archiso/packages.pi.aarch64 no trae plymouth: mkinitcpio falla con \"Hook 'plymouth' cannot be found\" en el paso initcpio y la instalación de la pi se para. Arreglo: añadir plymouth a packages.pi.aarch64 (o no añadir el hook en aarch64)."

[[issue]]
id = "edition-pkg:pi/aarch64:qemu-guest-agent"
note = "archiso/packages.pi.aarch64 no trae qemu-guest-agent, que traen las demás listas: la prueba de arranque (tests/vm/boot_smoke.py) espera al guest agent y no puede inspeccionar la Live pi. No afecta a quien usa la ISO; deja la edición pi sin prueba de arranque. Arreglo: añadir qemu-guest-agent a packages.pi.aarch64."

[[issue]]
id = "edition-pkg:pi/aarch64:sudo"
note = "root/scripts/users.sh escribe /etc/sudoers.d/churros y /usr/local/bin/calamares se eleva con `exec sudo -n`, pero archiso/packages.pi.aarch64 no trae sudo (ni le llega como dependencia): en la Live pi no hay sudo y el instalador no puede arrancar como root. Arreglo: añadir sudo a packages.pi.aarch64."

[[issue]]
id = "edition-pkg:pi/aarch64:zsh"
note = "root/scripts/users.sh crea churros con `-s /bin/zsh` y archiso/airootfs/etc/passwd da /usr/bin/zsh a root, pero archiso/packages.pi.aarch64 no trae zsh: los dos usuarios de la Live pi tienen una shell que no existe (el login en consola, su y sudo -i fallan). Arreglo: añadir zsh a packages.pi.aarch64."

[[issue]]
id = "edition-pkg:server/x86_64:kpmcore"
note = "La Live de server arranca XFCE solo para ejecutar el instalador gráfico (comentario de build.sh), pero archiso/packages.server.x86_64 no trae kpmcore y no le llega como dependencia (pacman -Sp de la lista: kcoreaddons y qt6-translations sí llegan por kcrash y qt6-base, este no). Calamares se desempaqueta con bsdtar sin dependencias, así que /usr/local/bin/calamares encuentra librerías sin resolver y la edición server no se puede instalar. Arreglo: copiar a packages.server.x86_64 el bloque 'Calamares installer dependencies' de packages.x86_64."

