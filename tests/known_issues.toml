[[issue]]
id = "unit-dep:niri/x86_64:etc/systemd/system/livecd-talk.service:espeakup.service"
note = "etc/systemd/system/livecd-talk.service (entrada de arranque Accessibility, accessibility=on) ejecuta `ExecStartPost=systemctl start espeakup.service`, pero archiso/packages.x86_64 no trae espeakup (solo packages.aarch64 lo lista; la releng de archiso lo incluye): systemctl falla, la unidad queda failed y no hay lector de pantalla. Se suma a que /usr/local/bin/livecd-sound sale 0644 (exec-mode:/usr/local/bin/livecd-sound). Arreglo: añadir espeakup a la lista."

