[[issue]]
id = "ref:niri/x86_64:rust/preferences:gamemoded"
note = "Ajustes > Energía (rust/preferences/src/services/power.rs, gamemode_status) muestra el estado de Feral GameMode con `gamemoded -s`, pero ninguna lista instala gamemode: el código lo comprueba con which() y en niri/x86_64 siempre dirá 'No instalado'. Decidir si gamemode entra en la lista (paquete gamemode de [extra]) o si se quita esa fila."

[[issue]]
id = "ref:niri/aarch64:rust/preferences:gamemoded"
note = "Ajustes > Energía (rust/preferences/src/services/power.rs, gamemode_status) muestra el estado de Feral GameMode con `gamemoded -s`, pero ninguna lista instala gamemode: el código lo comprueba con which() y en niri/aarch64 siempre dirá 'No instalado'. Decidir si gamemode entra en la lista (paquete gamemode de [extra]) o si se quita esa fila."

[[issue]]
id = "iso-niri-aarch64:not-executable:/usr/local/bin/livecd-sound"
note = "En la ISO aarch64 (iso-arm64.yml), /usr/local/bin/livecd-sound tiene modo 644: mkarchiso no conserva el +x de git y profiledef.sh no lo declara en file_permissions. En la entrada Accessibility, livecd-alsa-unmuter.service y livecd-talk.service fallan con 203/EXEC. Mismo fallo que exec-mode:/usr/local/bin/livecd-sound."

[[issue]]
id = "iso-niri-aarch64:not-executable:/usr/local/bin/Installation_guide"
note = "En la ISO aarch64 (iso-arm64.yml), /usr/local/bin/Installation_guide tiene modo 644 (sin entrada en file_permissions): 'permission denied' al ejecutarlo en el Live. Mismo fallo que exec-mode:/usr/local/bin/Installation_guide."

[[issue]]
