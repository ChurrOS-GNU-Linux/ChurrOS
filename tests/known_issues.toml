[[issue]]
id = "unit-link:*:etc/systemd/system/multi-user.target.wants/ModemManager.service"
note = "etc/systemd/system/multi-user.target.wants/ModemManager.service apunta a /usr/lib/systemd/system/ModemManager.service, del paquete modemmanager, que no está en ninguna lista ni llega como dependencia (comprobado con pacman -Sp de las seis listas). El enlace queda colgando: la Live no arranca ModemManager (módems 3G/4G) aunque el perfil lo pretende, y scripts/test-network-services.py exige el enlace. Arreglo: añadir modemmanager a las listas, o borrar multi-user.target.wants/ModemManager.service y el alias dbus-org.freedesktop.ModemManager1.service."

[[issue]]
id = "unit-link:*:etc/systemd/system/dbus-org.freedesktop.ModemManager1.service"
note = "El alias etc/systemd/system/dbus-org.freedesktop.ModemManager1.service apunta a /usr/lib/systemd/system/ModemManager.service, del paquete modemmanager, que no está en ninguna lista ni llega como dependencia (comprobado con pacman -Sp de las seis listas). El enlace queda colgando: la Live no arranca ModemManager (módems 3G/4G) aunque el perfil lo pretende, y scripts/test-network-services.py exige el enlace. Arreglo: añadir modemmanager a las listas, o borrar multi-user.target.wants/ModemManager.service y el alias dbus-org.freedesktop.ModemManager1.service."

[[issue]]
id = "unit-enable:pi/aarch64:ufw.service"
note = "root/scripts/services.sh (enable_unit ufw.service) y Calamares services-systemd.conf activan ufw.service, pero archiso/packages.pi.aarch64 no trae ufw: enable_unit solo avisa, Calamares lo salta (no es mandatory) y la Live y el sistema instalado de la pi quedan sin cortafuegos; Ajustes > Privacidad ejecuta ufw y falla. Arreglo: añadir ufw a packages.pi.aarch64."

# --- test_build_dryrun ---
[[issue]]
id = "build:edition-list-backup-overwritten"
note = "scripts/cli/build.sh (paso 0) copia archiso/packages.<arch> a packages.<arch>.orig sin mirar si ya existe, al contrario que el .bak de greetd/config.toml. Si un build --edition xfce|server se interrumpe (SIGKILL, OOM, docker kill) packages.x86_64 se queda con la lista de esa edición; el siguiente build --edition server|xfce la guarda como copia de seguridad y al terminar la restaura: packages.x86_64 queda con la lista XFCE y la de niri se pierde (solo se recupera con git)."

[[issue]]
id = "build:edition-list-not-restored-for-niri"
note = "Tras un build --edition xfce|server interrumpido, el build por defecto (niri) no recupera archiso/packages.x86_64 del .orig que quedó: el paso 0 de scripts/cli/build.sh solo corre para ediciones distintas de niri y el trap solo restaura con PACKAGES_BACKED_UP=1. mkarchiso construye la ISO niri con la lista de XFCE (sin niri, foot ni base-devel) y greetd hace autologin a `niri`, que no está instalado. El árbol queda con packages.x86_64 modificado y el .orig."

[[issue]]
id = "build:aarch64-build-deletes-x86_64-local-packages"
note = "El bucle de bsdtar del paso 2 de scripts/cli/build.sh recorre siempre archiso/packages/*.pkg.tar.zst, aunque el repo local de aarch64 es archiso/packages/aarch64/. Un build aarch64 (./churros build --container --arch arm64) borra calamares, yay, wlogout y bazaar x86_64 de archiso/packages/ por ser de otra arquitectura, y el siguiente build x86_64 tiene que recompilarlos (Calamares desde el código fuente, con red)."

[[issue]]
id = "build:not-ignored-after-interrupt:archiso/airootfs/usr/bin/churros-tour"
note = ".gitignore lista los binarios Rust que despliega scripts/build-rust.sh (churros-welcome, -settings, -popup, -control-center) pero no churros-tour. Si un build se interrumpe antes del trap, el ELF queda sin seguimiento en archiso/airootfs/usr/bin y un `git add -A` lo sube al repo."

# --- tests/iso/check_iso.py (confirmado en una ISO niri x86_64 construida) ---
[[issue]]
id = "iso-niri-x86_64:not-executable:/usr/local/bin/livecd-sound"
note = "En la ISO, /usr/local/bin/livecd-sound tiene modo 644: mkarchiso no conserva el +x de git y profiledef.sh no lo declara en file_permissions. En la entrada Accessibility, livecd-alsa-unmuter.service y livecd-talk.service fallan con 203/EXEC. Mismo fallo que exec-mode:/usr/local/bin/livecd-sound."

[[issue]]
id = "iso-niri-x86_64:not-executable:/usr/local/bin/Installation_guide"
note = "En la ISO, /usr/local/bin/Installation_guide tiene modo 644 (sin entrada en file_permissions): 'permission denied' al ejecutarlo en el Live. Mismo fallo que exec-mode:/usr/local/bin/Installation_guide."

[[issue]]
id = "iso-niri-x86_64:unit-link:/etc/systemd/system/multi-user.target.wants/ModemManager.service"
note = "En la ISO, multi-user.target.wants/ModemManager.service apunta a /usr/lib/systemd/system/ModemManager.service, que no existe: modemmanager no está en ninguna lista. Mismo fallo que unit-link:*:etc/systemd/system/multi-user.target.wants/ModemManager.service."

[[issue]]
id = "iso-niri-x86_64:unit-link:/etc/systemd/system/dbus-org.freedesktop.ModemManager1.service"
note = "En la ISO, el alias dbus-org.freedesktop.ModemManager1.service apunta a una unidad que no existe (modemmanager no se instala). Mismo fallo que unit-link:*:etc/systemd/system/dbus-org.freedesktop.ModemManager1.service."

