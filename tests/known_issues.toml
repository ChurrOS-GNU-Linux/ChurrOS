[[issue]]
id = "boot-server-x86_64:process:churros-welcome"
note = "Confirmado arrancando la ISO server en QEMU: la sesión XFCE del Live llega al escritorio, pero la bienvenida (la entrada al instalador) no se abre. El autostart XFCE ejecuta `churros-welcome --live-only` y main.rs acaba en app.run(), que pasa argv a GApplication: 'Unknown option --live-only', sale con 1. Mismo fallo que rust-cli:churros-welcome --live-only."

[[issue]]
id = "boot-xfce-x86_64:process:churros-welcome"
note = "Misma causa que boot-server:process:churros-welcome (mismo autostart OnlyShowIn=XFCE y misma sesión churros-xfce-session): en el Live XFCE la bienvenida no se abre. Arreglo: app.run_with_args(&[] as &[&str]) en rust/churros-welcome/src/main.rs."

[[issue]]
id = "unit-enable:niri/aarch64:ananicy-cpp.service"
note = "services.sh habilita ananicy-cpp.service en todas las ediciones, pero solo packages.x86_64 (niri) instala ananicy-cpp, del repo [cachyos] que solo existe en pacman.x86_64.conf: en niri/aarch64 la unidad no existe y enable_unit solo avisa. Decidir si se instala también aquí o si services.sh lo habilita solo donde se instala."

