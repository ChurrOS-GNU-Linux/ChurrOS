[[issue]]
id = "edition-pkg:niri/aarch64:zram-generator"
note = "archiso/packages.aarch64 no trae zram-generator, pero la airootfs común lleva etc/systemd/zram-generator.conf: la Live de niri/aarch64 arranca sin swap zram y con poca RAM unpackfs puede acabar en OOM. Arreglado solo en XFCE (fix/calamares-2gb-ram-xfce); falta comprobar que el paquete existe en el repo de esa arquitectura antes de añadirlo."

