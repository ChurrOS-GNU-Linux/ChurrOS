name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Static checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install shellcheck, gettext and zstd
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck gettext zstd

      - name: Run checks
        run: ./churros check

      # ./churros check ya los lanza, pero sin node solo avisa: aquí tienen que
      # ejecutarse sí o sí.
      - name: Polkit rule tests
        run: node scripts/test-polkit-rules.js

      - name: Privileged helper tests
        run: |
          python3 scripts/test-privileged-helpers.py
          python3 scripts/test-kde-integration.py

  test:
    name: Tests Rust
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: cargo test -p churros-services
        run: cargo test -p churros-services --manifest-path rust/Cargo.toml
