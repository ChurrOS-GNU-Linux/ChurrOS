name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Modo estricto (GitHub ya exporta CI=true): una herramienta que falta
      # o una prueba saltada es un fallo, no un aviso.
      CHURROS_STRICT: 1

    steps:
      - uses: actions/checkout@v7

      # shellcheck, msgfmt (gettext), zstd (tarballs de test-privileged-helpers),
      # zsh (zsh -n de .zlogin/.zshrc), desktop-file-validate y PyYAML (YAML de
      # Calamares y de los workflows). node ya viene en el runner.
      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck gettext zstd zsh desktop-file-utils python3-yaml

      # check.sh incluye las pruebas de tests/static, test-polkit-rules.js,
      # test-privileged-helpers.py y test-network-services.py.
      - name: ./churros test
        run: ./churros test

  mutations:
    name: Test suite self-test (mutations)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CHURROS_STRICT: 1

    steps:
      - uses: actions/checkout@v7

      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck gettext zstd zsh desktop-file-utils python3-yaml

      # Cada mutación de tests/mutations/mutations.toml es una regresión real
      # (un paquete quitado, un permiso perdido, un paso de Calamares fuera de
      # orden...). Si alguna deja la batería en verde, una prueba se ha
      # debilitado o ha dejado de cubrir lo que dice.
      - name: ./churros test --mutations
        run: ./churros test --mutations

  test:
    name: Tests Rust
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: cargo test -p churros-services
        run: cargo test -p churros-services --manifest-path rust/Cargo.toml
