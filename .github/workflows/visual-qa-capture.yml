name: Visual QA capture

# Cuando el diff es visual, espera las ISO del workflow visual-qa-iso y
# captura las mismas pantallas de main (before) y del PR (after).
# No es un check requerido. Si la ISO no llega a tiempo, el manifiesto
# queda en iso-missing y el job no bloquea el merge.

on:
  pull_request:

permissions:
  contents: read
  actions: read

concurrency:
  group: visual-qa-capture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    outputs:
      visual: ${{ steps.gate.outputs.visual }}
      main_sha: ${{ steps.gate.outputs.main_sha }}
      edition: ${{ steps.gate.outputs.edition }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Decide whether to capture
        id: gate
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VISUAL_QA_JEV_MODEL: ${{ vars.VISUAL_QA_JEV_MODEL }}
          VISUAL_QA_JEV_THRESHOLD: ${{ vars.VISUAL_QA_JEV_THRESHOLD }}
          VISUAL_QA_MODEL: ${{ vars.VISUAL_QA_MODEL }}
        run: |
          set -euo pipefail
          git diff --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed.txt"
          git diff --unified=1 HEAD^1 HEAD > "$RUNNER_TEMP/diff.txt"
          python3 scripts/qa/visual/classify.py \
            --paths-file "$RUNNER_TEMP/changed.txt" \
            --diff-file "$RUNNER_TEMP/diff.txt" \
            --github-output "$GITHUB_OUTPUT"
          {
            echo "main_sha=$(git rev-parse 'HEAD^1')"
            echo "edition=niri"
          } >> "$GITHUB_OUTPUT"

  capture:
    name: Boot and capture
    needs: gate
    if: needs.gate.outputs.visual == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    continue-on-error: true
    env:
      EDITION: ${{ needs.gate.outputs.edition }}
      MAIN_SHA: ${{ needs.gate.outputs.main_sha }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Install QEMU
        timeout-minutes: 15
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y -o Acquire::Retries=3 \
            qemu-system-x86 qemu-utils ovmf \
            xvfb x11-apps libgl1-mesa-dri xdotool

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Wait for ISO artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          VISUAL_QA_WAIT_SECONDS: ${{ vars.VISUAL_QA_WAIT_SECONDS }}
        run: scripts/qa/visual/wait-isos.sh --edition "$EDITION" --pr-sha "$GITHUB_SHA" --main-sha "$MAIN_SHA" --dest "$RUNNER_TEMP/isos"

      - name: Capture before and after
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VISUAL_QA_MODEL: ${{ vars.VISUAL_QA_MODEL }}
        run: |
          set -euo pipefail
          git diff --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed.txt"
          python3 scripts/qa/visual/screens.py \
            --paths-file "$RUNNER_TEMP/changed.txt" \
            --out "$RUNNER_TEMP/plan.json"
          status="$RUNNER_TEMP/isos/status.json"
          main_iso="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8")).get("main_iso") or "")' "$status")"
          pr_iso="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8")).get("pr_iso") or "")' "$status")"
          if [[ -n "$main_iso" ]]; then
            scripts/qa/visual/capture.sh --iso "$main_iso" --out out/before --plan "$RUNNER_TEMP/plan.json" --role before
          else
            scripts/qa/visual/capture.sh --missing --out out/before --plan "$RUNNER_TEMP/plan.json" --role before
          fi
          if [[ -n "$pr_iso" ]]; then
            scripts/qa/visual/capture.sh --iso "$pr_iso" --out out/after --plan "$RUNNER_TEMP/plan.json" --role after
          else
            scripts/qa/visual/capture.sh --missing --out out/after --plan "$RUNNER_TEMP/plan.json" --role after
          fi

      - name: Upload before
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-qa-before-${{ github.sha }}
          path: out/before/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload after
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-qa-after-${{ github.sha }}
          path: out/after/
          if-no-files-found: ignore
          retention-days: 7
