name: ISO x86_64

# Prueba end-to-end de la ISO x86_64: se construye como en local
# (./churros build --container), se audita su contenido sin arrancarla
# (tests/iso/check_iso.py) y se arranca en QEMU con KVM hasta el escritorio
# Live (tests/vm/boot_smoke.py: systemd sin unidades fallidas, sesión gráfica
# de churros, procesos del escritorio, ventana de bienvenida, captura).
#
# Es la única capa que ve el producto final: las pruebas de ci.yml modelan el
# sistema a partir del repo, pero un paquete renombrado en Arch, un permiso
# que mkarchiso no aplica o un escritorio que se cae al arrancar solo
# aparecen aquí.
#
# Cuándo corre (nunca en un pull request: no bloquea merges):
#   - cada noche en main, las tres ediciones x86_64: Arch es rolling y la
#     ISO se puede romper sin ningún commit nuestro. schedule solo corre
#     en la rama por defecto;
#   - a mano (workflow_dispatch), en cualquier rama, eligiendo edición.
# El paso `pick` sigue sabiendo elegir ediciones a partir de un diff de PR
# (tests/static lo ejecuta), pero este workflow ya no se dispara ahí.

on:
  workflow_dispatch:
    inputs:
      edition:
        description: Edición
        type: choice
        options: [niri, xfce, server]
        default: niri
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  # La edición va en la clave: dos ejecuciones manuales de ediciones distintas
  # no se cancelan entre sí.
  group: iso-${{ github.ref }}-${{ github.event_name }}-${{ inputs.edition }}
  cancel-in-progress: true

jobs:
  matrix:
    name: Editions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      editions: ${{ steps.pick.outputs.editions }}
      bios: ${{ steps.pick.outputs.bios }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      # El workflow ya no se dispara en pull_request. La rama del case se
      # conserva: tests/static ejecuta este paso con EVENT=pull_request
      # (HEAD^1..HEAD sería el diff del PR).
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          EDITION: ${{ inputs.edition }}
        run: |
          case "$EVENT" in
            pull_request)
              changed=$(git diff --name-only HEAD^1 HEAD)
              printf '%s\n' "$changed"
              python3 tests/iso/pick_editions.py --pull-request <<< "$changed" >> "$GITHUB_OUTPUT" ;;
            workflow_dispatch) python3 tests/iso/pick_editions.py --edition "$EDITION" >> "$GITHUB_OUTPUT" ;;
            *)                 python3 tests/iso/pick_editions.py --all >> "$GITHUB_OUTPUT" ;;
          esac
          cat "$GITHUB_OUTPUT"

  iso:
    name: Build, audit and boot (${{ matrix.edition }})
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        edition: ${{ fromJSON(needs.matrix.outputs.editions) }}
    env:
      CHURROS_CONTAINER_ENGINE: docker
      CHURROS_STRICT: 1
      EDITION: ${{ matrix.edition }}

    steps:
      - uses: actions/checkout@v7

      # El build (caché de pacman, work/ de mkarchiso, Rust, Calamares) no
      # cabe en los ~14 GB libres del runner.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      # niri 26.04 descarta el renderizado EGL por software: sin 3D en la VM
      # arranca sin ninguna salida. tests/vm da virgl al invitado con la
      # ventana SDL de QEMU en un Xvfb y el GL de Mesa (el runner no tiene GPU).
      # Un espejo colgado no debe comerse el timeout del job.
      - name: Install QEMU and ISO tools
        timeout-minutes: 15
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y -o Acquire::Retries=3 \
            qemu-system-x86 qemu-system-gui qemu-utils ovmf \
            xorriso squashfs-tools xvfb x11-apps libgl1-mesa-dri libegl1

      # Los runners Linux de GitHub tienen /dev/kvm, pero solo root puede
      # abrirlo hasta que se añade esta regla.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Build ISO
        id: build
        run: ./churros build --container --edition "$EDITION"

      - name: Audit ISO content
        run: |
          mkdir -p out/reports
          python3 tests/iso/check_iso.py out/*.iso --edition "$EDITION" --report out/reports/iso-content.json

      - name: Boot ISO in QEMU (UEFI)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python3 tests/vm/boot_smoke.py out/*.iso --edition "$EDITION" --artifacts out/reports/boot-uefi

      - name: Boot ISO in QEMU (BIOS)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && needs.matrix.outputs.bios == 'true' }}
        run: python3 tests/vm/boot_smoke.py out/*.iso --edition "$EDITION" --firmware bios --artifacts out/reports/boot-bios

      # Consola serie, diario, captura de pantalla e informe JSON: con esto se
      # diagnostica un fallo de arranque sin reproducirlo en local.
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: churros-${{ matrix.edition }}-reports
          path: out/reports/
          if-no-files-found: ignore
          retention-days: 14

      - name: SHA256SUMS
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: out
        run: sha256sum -- *.iso > SHA256SUMS

      # Aunque la auditoría o el arranque fallen: la ISO sirve para investigarlo.
      # Este workflow ya no corre en pull_request, así que no hace falta filtrar
      # el evento: schedule y workflow_dispatch suben la ISO y su SHA256SUMS.
      - name: Upload ISO
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: churros-${{ matrix.edition }}-x86_64-iso
          path: |
            out/*.iso
            out/SHA256SUMS
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
