name: Rust

# Aquí se compila y se prueba el workspace completo (cargo build, test y
# clippy), incluido churros-services: ci.yml ya no lanza cargo test. Un error
# de compilación en welcome, settings, control center, popups o tour no
# espera a la ISO.
#
# Compilar no es arrancar. cargo test no abre ninguna ventana: los fallos en
# tiempo de ejecución solo se ven en las pruebas que ejecutan las apps en
# Broadway (gtk4-broadwayd), dentro del contenedor:
#   - scripts/test-tour.py: los tests #[ignore] del recorrido, que manejan
#     por API sus páginas de personalización e instalación;
#   - scripts/test-gui-smoke.py: solo arranca cada binario desplegado (y
#     churros-popup con cada popup) en release, con los programas externos
#     ausentes y fallando, y falla si muere o entra en pánico en los
#     primeros segundos.
# Un pánico al usar la bienvenida, los ajustes, el centro de control o los
# popups después del arranque sigue sin verse hasta probarlos a mano.
#
# gtk4-rs 0.11 pide GTK >= 4.22 y libadwaita-rs 0.9 pide libadwaita >= 1.9.
# Ubuntu no llega a esas versiones, así que el job usa la imagen del
# Containerfile (Arch) y los mismos comandos que en local: ./churros rust y,
# para las dos pruebas de Broadway, ./churros test --gui (aquí en pasos
# separados, para ver cuál falla).
#
# La imagen se construye en cada ejecución, sin caché de capas, y además una
# vez por semana: Arch es rolling, y si un cambio de paquetes rompe el
# Containerfile tiene que fallar aquí y no en la máquina de quien construye.
#
# El workspace se compila también en ARM64, en un runner arm64 con la misma
# imagen sobre Arch Linux ARM: un cargo check cruzado desde x86_64 no sirve,
# porque glib-sys y gtk4-sys buscan con pkg-config las bibliotecas de aarch64.
# La base es docker.io/menci/archlinuxarm (pacstrap diario desde los
# repositorios de Arch Linux ARM); no hay imagen oficial para aarch64.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  # En main (push y el schedule semanal) no se cancela: se encolan.
  # Solo un PR nuevo cancela la ejecución anterior.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  apps:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Build and test apps (Containerfile)
            runner: ubuntu-latest
            base: ''
            cache: rust-container-
            iso-tools: true
          - name: Build and test apps (Containerfile, ARM64)
            runner: ubuntu-24.04-arm
            base: docker.io/menci/archlinuxarm:latest
            # Prefijo propio: restore-keys de x86_64 (rust-container-) no
            # debe recuperar un target de aarch64.
            cache: rust-arm64-container-
            # Arch Linux ARM no empaqueta archiso (ver Containerfile).
            iso-tools: false

    env:
      # El runner trae podman y docker; docker corre sin sudo para el usuario
      # del runner.
      CHURROS_CONTAINER_ENGINE: docker
      # Vacía = la imagen oficial de Arch (x86_64).
      CHURROS_CONTAINER_BASE: ${{ matrix.base }}

    steps:
      - uses: actions/checkout@v7

      # ./churros rust compila en rust/target/container (lo monta en el
      # contenedor con el UID del runner); test-gui-smoke.py añade release/.
      # actions/cache no vuelve a guardar si la clave coincide: el prefijo
      # v2- fuerza una caché nueva que incluya release/.
      - name: Cache cargo target
        uses: actions/cache@v6
        with:
          path: rust/target/container
          key: ${{ matrix.cache }}v2-${{ hashFiles('Containerfile', 'rust/Cargo.lock') }}
          restore-keys: ${{ matrix.cache }}

      - name: Build container image
        run: |
          source scripts/lib/container.sh
          container_engine_init
          container_ensure_image

      # Las mismas herramientas que comprueba el pre-flight de build.sh, más
      # makepkg y node: ./churros build --container falla si falta alguna.
      - name: ISO build tools present in the image
        if: matrix.iso-tools
        run: |
          source scripts/lib/container.sh
          container_engine_init
          # $tool se expande en el bash del contenedor, no en el runner.
          # shellcheck disable=SC2016
          container_run -- bash -c '
            for tool in mkarchiso mksquashfs xorriso grub-mkstandalone mkfs.fat mcopy mmd \
                        makepkg repo-add cargo node python3; do
              command -v "$tool" >/dev/null || { echo "falta $tool en la imagen"; exit 1; }
            done
            echo "herramientas de build presentes"'

      # build + test + clippy del workspace. clippy no falla el job por avisos:
      # el workspace arrastra avisos previos.
      - name: ./churros rust
        run: ./churros rust

      # La prueba GTK del recorrido está marcada #[ignore] en cargo test:
      # scripts/test-tour.py la ejecuta en Broadway (gtk4-broadwayd), con
      # sockets privados y HOME temporal. Reutiliza lo que compiló el paso
      # anterior.
      - name: Tour GTK test (Broadway)
        run: |
          source scripts/lib/container.sh
          container_engine_init
          container_run -- python3 scripts/test-tour.py

      # Arranque de cada app GTK desplegada (deploy = true) y de churros-popup
      # con cada nombre de POPUPS, compiladas en release como en la ISO
      # (panic = "abort"), con los programas externos ausentes y fallando:
      # falla si una muere o entra en pánico en sus primeros segundos. Ni
      # cargo test ni el arranque de la ISO en QEMU (que solo mira la
      # bienvenida) ejecutan settings, control center o popups.
      - name: GUI startup smoke test (Broadway)
        # Independiente de la prueba del tour: que esa falle no esconde esta.
        if: ${{ !cancelled() }}
        run: |
          source scripts/lib/container.sh
          container_engine_init
          container_run -e CHURROS_STRICT=1 -- python3 scripts/test-gui-smoke.py

      # tests/container: las listas de paquetes contra los repos reales de
      # esta arquitectura (pacman), la tabla comando -> paquete (pacman -F) y
      # `niri validate` sobre la configuración que se instala.
      - name: ./churros test --container
        # No depende de la prueba del tour: que esta falle no puede esconder
        # la capa de contenedor.
        if: ${{ !cancelled() }}
        env:
          CHURROS_STRICT: 1
        run: ./churros test --container

      # Autoprueba de tests/container (semanal y a mano; tarda ~10 min): cada
      # mutación con requires = "container" de tests/mutations/mutations.toml
      # tiene que hacer fallar su prueba.
      - name: ./churros test --container --mutations
        if: github.event_name != 'pull_request' && matrix.iso-tools
        env:
          CHURROS_STRICT: 1
        run: ./churros test --container --mutations
