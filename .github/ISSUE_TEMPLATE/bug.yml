name: Informe de error
description: Algo no funciona como debería en ChurrOS.
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por el reporte. Cuanta más información, más fácil reproducir y arreglar.
        Busca antes si ya hay un issue abierto sobre lo mismo.
        Las vulnerabilidades no se reportan aquí: sigue [SECURITY.md](https://github.com/ChurrOS-GNU-Linux/ChurrOS/blob/main/SECURITY.md).
  - type: textarea
    id: description
    attributes:
      label: Descripción
      description: Qué ocurre y por qué es un problema.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducir
      description: Lista numerada, lo más concreta posible.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Resultado esperado
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Resultado obtenido
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Entorno
      options:
        - ISO live (QEMU / máquina virtual)
        - ISO live (hardware)
        - Sistema instalado
        - Solo host de desarrollo (scripts / docs)
        - Otro
    validations:
      required: true
  - type: dropdown
    id: edition
    attributes:
      label: Edición
      description: En el sistema, `VARIANT_ID` de `/etc/os-release`. Al construir, la de `./churros build --edition`.
      options:
        - niri (por defecto)
        - xfce
        - server (sin escritorio)
        - pi (Raspberry Pi, aarch64)
        - No lo sé / no aplica
    validations:
      required: true
  - type: dropdown
    id: arch
    attributes:
      label: Arquitectura
      description: Aparece en el nombre de la ISO; en el sistema, `uname -m`.
      options:
        - x86_64
        - aarch64 (arm64)
        - i686 (32 bits)
        - No lo sé / no aplica
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión o commit
      description: En el sistema, `VERSION` de `/etc/os-release`. Si no, el nombre del fichero de la ISO, la etiqueta de release o el hash de commit.
      placeholder: "p. ej. 1.3, ChurrOS-AAAA.MM.DD-x86_64.iso o 8ce2d58"
  - type: textarea
    id: hardware
    attributes:
      label: Hardware
      description: |
        Solo si el error ocurre en un equipo real: modelo, CPU, GPU y tarjeta wifi.
        Ayuda pegar la salida de `lspci -nn` y `lsusb`.
      render: shell
  - type: textarea
    id: logs
    attributes:
      label: Registros
      description: Salida relevante de terminal, `vm_serial.log`, `journalctl -b`, etc. Las capturas se pueden adjuntar en la descripción.
      render: shell
