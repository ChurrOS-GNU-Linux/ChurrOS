name: Propuesta de mejora
description: Idea o cambio de comportamiento para discutir antes de implementar.
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Para cambios grandes, conviene discutirlos aquí antes de abrir un PR. Un programa, una edición o una arquitectura nuevos no se empiezan hasta que la propuesta se apruebe según [docs/principios.md](https://github.com/ChurrOS-GNU-Linux/ChurrOS/blob/main/docs/principios.md).
        Las ideas pequeñas o todavía sin concretar van mejor en GitHub Discussions, categoría Ideas, cuando esté activado.
  - type: textarea
    id: problem
    attributes:
      label: Problema o necesidad
      description: Qué falta o qué se quiere mejorar.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Propuesta
      description: Cómo se imagina la solución (a alto nivel).
    validations:
      required: true
  - type: textarea
    id: principle
    attributes:
      label: Principio y coste de mantenimiento
      description: Qué principio de docs/principios.md sirve esta propuesta, y qué sustituye o qué se deja de mantener a cambio. Si no sustituye nada, quién la mantendrá.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas consideradas
      description: Otras opciones o por qué esta es preferible.
  - type: textarea
    id: context
    attributes:
      label: Contexto adicional
      description: Enlaces, capturas, issues relacionados, etc.
