# systemd-oomd (services.sh lo habilita): si la sesión gráfica pasa más del
# 50 % del tiempo esperando memoria durante 20 s (DefaultMemoryPressureDurationSec),
# se cierra el cgroup que más presiona en vez de congelar el equipo entero.
# Es lo que Fedora trae por defecto (systemd-oomd-defaults). docs/memory.md.
[Service]
ManagedOOMMemoryPressure=kill
ManagedOOMMemoryPressureLimit=50%
