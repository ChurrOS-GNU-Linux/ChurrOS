# MGLRU: no expulsar páginas usadas en el último segundo. Con 2 GiB evita que
# el escritorio se quede atascado en thrashing (el kernel prefiere el OOM a
# paginar sin fin el código en uso). Sin MGLRU el fichero no existe y "w-"
# no hace nada. docs/memory.md.
w- /sys/kernel/mm/lru_gen/min_ttl_ms - - - - 1000
