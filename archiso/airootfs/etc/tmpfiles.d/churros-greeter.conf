# Fondo de la pantalla de inicio (ReGreet, docs/login-greeter.md).
#
# Lo escribe la sesión del usuario (churros-settings --sync-greeter, al
# cambiar el fondo del escritorio) sin pasar por root: el directorio es del
# grupo wheel, con setgid para que los ficheros nuevos lo hereden. El greeter
# (usuario greeter) solo lo lee. Si falta, se copia el fondo por defecto ya
# difuminado.
d /var/lib/churros 0755 root root -
d /var/lib/churros/greeter 2775 root wheel -
C /var/lib/churros/greeter/background.jpg - - - - /usr/share/churros/greeter/background.jpg
