# ChurrOSvyper Performance & Anti-Freeze Tuning
# (Inspirado en CachyOS para máxima respuesta interactiva)

# Forzar uso preferente de zram sobre descartar caché de archivos
vm.swappiness = 100

# Lectura de páginas individuales (óptimo para zram, sin sobrecarga de readahead)
vm.page-cluster = 0

# Mantener metadatos de inodos y directorios en RAM (navegación y terminal ultra rápidas)
vm.vfs_cache_pressure = 50

# Evitar congelamientos del escritorio durante transferencias USB y descargas pesadas
vm.dirty_bytes = 268435456
vm.dirty_background_bytes = 67108864
vm.dirty_writeback_centisecs = 1500

# Desactivar NMI watchdog (libera interrupciones periódicas de CPU y ahorra batería)
kernel.nmi_watchdog = 0

# Habilitar clonación de namespaces no privilegiados
kernel.unprivileged_userns_clone = 1

# Aumentar límite de descriptores de archivo para compilaciones y juegos
fs.file-max = 2097152

# Límite de inotify para editores de código, IDEs y administradores de archivos
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 1024

# Optimización de buffers y congestión TCP
net.core.netdev_max_backlog = 4096
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
