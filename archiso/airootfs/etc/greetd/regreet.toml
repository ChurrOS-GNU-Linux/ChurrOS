# ChurrOS ReGreet Configuration (GTK4 Graphical Login)

# Reuse the last successful user/session and show the password prompt directly.
# Cancel returns to the user/session selector.
skip_selection = true

[background]
# Written by the user's session (churros-settings --sync-greeter): the desktop
# wallpaper, or the image chosen in Settings, blurred if asked. tmpfiles.d
# seeds it with the pre-blurred default wallpaper (docs/login-greeter.md).
path = "/var/lib/churros/greeter/background.jpg"
fit = "Cover"


[GTK]
application_prefer_dark_theme = true
cursor_theme_name = "Adwaita"
font_name = "Inter 11"
icon_theme_name = "Papirus-Dark"
theme_name = "Adwaita-dark"

[commands]
reboot = ["systemctl", "reboot"]
poweroff = ["systemctl", "poweroff"]

[appearance]
greeting_msg = "ChurrOS"

# Date above, large time below. ReGreet 0.5 renders the clock with Pango
# markup; configure-greeter-locale rewrites only the date part per language.
[widget.clock]
format = "<span size='15pt' weight='600'>%A, %-d %B</span>\n<span size='72pt' weight='bold' font_features='tnum' letter_spacing='-2048'>%H:%M</span>"
resolution = "1s"
label_width = 520
