# Touchpad en las sesiones X11 (XFCE). libinput deja el toque para clic
# apagado por defecto: en portátiles cuyo touchpad no tiene botones físicos
# separados (HP Laptop 15, Ryzen 7500U) eso parece "el clic no funciona".
Section "InputClass"
    Identifier "churros touchpad"
    MatchIsTouchpad "on"
    MatchDevicePath "/dev/input/event*"
    Driver "libinput"
    Option "Tapping" "on"
    Option "TappingButtonMap" "lrm"
    Option "TappingDrag" "on"
    Option "DisableWhileTyping" "on"
EndSection
