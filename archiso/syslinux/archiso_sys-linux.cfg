LABEL arch
TEXT HELP
Boot the ChurrOS live medium on BIOS.
It allows you to install ChurrOS or perform system maintenance.
ENDTEXT
MENU LABEL ChurrOS Live (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% copytoram=n cow_spacesize=2G

# Accessibility boot option
LABEL archspeech
TEXT HELP
Boot the ChurrOS live medium on BIOS with speakup screen reader.
It allows you to install ChurrOS or perform system maintenance with speech feedback.
ENDTEXT
MENU LABEL ChurrOS Live (%ARCH%, BIOS) with ^speech
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on copytoram=n cow_spacesize=2G
