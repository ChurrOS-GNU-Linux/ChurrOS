# aarch64 archiso initramfs. mkinitcpio-archiso 73 (ALARM extra) ships
# archiso, archiso_loop_mnt and the archiso_pxe_* install hooks. It does
# not ship a memdisk hook: that one comes from mkinitcpio and wants
# syslinux's memdisk, which ALARM does not package. The pxe hooks call
# /usr/lib/initcpio/ipconfig (mkinitcpio-nfs-utils), also absent here.
# x86_64 keeps both in airootfs/etc/mkinitcpio.conf.d/archiso.conf.
HOOKS=(base udev microcode modconf kms archiso archiso_loop_mnt block filesystems keyboard)
COMPRESSION="zstd"
COMPRESSION_OPTIONS=(-3)
