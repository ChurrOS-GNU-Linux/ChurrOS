---
useSystemdHook: false

hooks:
  # Sin plymouth: initcpiocfg ya lo añade solo (antes de filesystems) cuando
  # el destino tiene /usr/bin/plymouth. Ponerlo aquí lo duplicaba en HOOKS, y
  # en una edición sin plymouth sería un hook inexistente.
  prepend: []
  append: []
  remove: []

source: "/etc/mkinitcpio.conf"
