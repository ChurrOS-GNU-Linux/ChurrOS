---
dontChroot: false
timeout: 120
verbose: false

script:
  - command: "pacman-key --init"
    timeout: 120
  - command: "pacman-key --populate archlinux"
    timeout: 120
  # Clave de CachyOS para [cachyos] (al final de /etc/pacman.conf: solo da
  # linux-cachyos y los cachyos-*). Sin ella, el primer pacman -Syu del
  # sistema instalado aborta por firma desconocida. Solo si la edición
  # instala cachyos-keyring.
  - command: "[ ! -f /usr/share/pacman/keyrings/cachyos.gpg ] || pacman-key --populate cachyos"
    timeout: 120
