---
displaymanagers:
  - greetd

# Un unico ejecutable para todas las ediciones: churros-xsession lee
# /etc/churros-edition y lanza churros-niri-session, churros-xfce-session o
# startplasma-wayland. Antes era "churros-niri-session" fijo, que en las
# ediciones xfce, kde y server apuntaba a un escritorio que no corresponde
# (y en server, a uno que no está instalado).
defaultDesktopEnvironment:
  executable: "churros-xsession"
  desktopFile: "churros-xsession"

basicSetup: false
sysconfigSetup: false
