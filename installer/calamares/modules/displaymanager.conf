---
displaymanagers:
  - greetd

# Un unico ejecutable para todas las ediciones: churros-xsession lee
# /etc/churros-edition y lanza churros-niri-session o churros-xfce-session.
# Antes era "churros-niri-session" fijo, que en las ediciones xfce y server
# apuntaba a un escritorio que no corresponde (y en server, a uno no instalado).
defaultDesktopEnvironment:
  executable: "churros-xsession"
  desktopFile: "churros-xsession"

basicSetup: false
sysconfigSetup: false
