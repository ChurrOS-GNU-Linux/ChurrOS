---
dontChroot: false
timeout: 60
verbose: true

script:
  - "mkdir -p /boot/grub/themes/churros"
  - "cp -r /usr/share/churros/grub-theme/. /boot/grub/themes/churros/"
  - "grep -q '^GRUB_THEME=' /etc/default/grub || echo 'GRUB_THEME=\"/boot/grub/themes/churros/theme.txt\"' >> /etc/default/grub"
  - "sed -i 's/^#\\?GRUB_GFXMODE=.*/GRUB_GFXMODE=\"1920x1080,auto\"/' /etc/default/grub || echo 'GRUB_GFXMODE=\"1920x1080,auto\"' >> /etc/default/grub"
  - "grep -q '^GRUB_GFXPAYLOAD_LINUX=' /etc/default/grub || echo 'GRUB_GFXPAYLOAD_LINUX=\"keep\"' >> /etc/default/grub"
  - "sed -i 's/^[[:space:]]*echo[[:space:]]\\+.\\?\\$message.\\?/#&/' /etc/grub.d/10_linux"
  - "rm -f /etc/grub.d/01_users /etc/grub.d/01_churros_lock"
  - "grub-mkconfig -o /boot/grub/grub.cfg"
  - "/usr/share/churros/scripts/make-boot-grub-readable"