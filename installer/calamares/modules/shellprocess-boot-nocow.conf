---
dontChroot: true
timeout: 30
verbose: true

# Run after mount and before unpackfs. New files in a btrfs /boot must inherit
# No_COW and no compression (+C +m), so GRUB can read vmlinuz. Other filesystems
# do not need these attributes. Do not add `btrfs property set ... compression`:
# the kernel rejects it with EINVAL on a No_COW inode, which aborted the install;
# +C already rules out compression and +m covers it explicitly.
script:
  - "mkdir -p \"${ROOT}/boot\" && if [ \"$(findmnt -n -o FSTYPE -T \"${ROOT}/boot\")\" = btrfs ]; then chattr +C +m \"${ROOT}/boot\"; fi"
  - "cd \"/run/archiso/bootmnt/churros/$(uname -m)\" && sha512sum --status -c airootfs.sha512 || { echo \"Error: ChurrOS Live image is corrupt; checksum verification failed. Re-download and rewrite the ISO.\" >&2; exit 1; }"
