---
dontChroot: true
timeout: 30
verbose: true

# Run after mount and before unpackfs. New files in /boot inherit No_COW
# and no compression (+C +m), so GRUB can read vmlinuz. Failures are ignored:
# ext4 installs do not need this, and /boot may already exist once the ESP is mounted.
script:
  - "-mkdir -p ${ROOT}/boot"
  - "-chattr +C +m ${ROOT}/boot"
  - "cd \"/run/archiso/bootmnt/churros/$(uname -m)\" && sha512sum --status -c airootfs.sha512 || { echo \"Error: ChurrOS Live image is corrupt; checksum verification failed. Re-download and rewrite the ISO.\" >&2; exit 1; }"
