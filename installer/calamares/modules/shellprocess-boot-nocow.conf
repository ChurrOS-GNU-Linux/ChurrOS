---
dontChroot: true
timeout: 30
verbose: true

# Run after mount and before unpackfs. New files in /boot inherit No_COW
# and no compression (+C +m), so GRUB can read vmlinuz. Failures are ignored:
# ext4 installs do not need this, and /boot may already exist once the ESP is mounted.
script:
  - "-mkdir -p ${ROOT}/boot"
  - "-chattr +C +m ${ROOT}/boot"
