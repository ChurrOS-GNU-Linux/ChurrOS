---
# Instala en el sistema los paquetes que haya elegido la pantalla «Selección
# de paquetes» (netinstall los deja en GlobalStorage packageOperations).
#
# Solo se instala lo que el usuario marcó: aquí no se quita nada. El bloque
# `operations: try_remove` que traía este fichero (archinstall, clonezilla,
# gpm, irssi, lynx, mc, testdisk, wvdial) estaba pensado para el Calamares de
# archiso y llevaba fuera de la secuencia desde d6b9dab: activarlo ahora
# quitaría esas herramientas del sistema instalado de todo el mundo, que es un
# cambio ajeno al soporte de NVIDIA y sin probar. Si se quiere recuperar, va en
# su propio cambio con su prueba.
backend: pacman

# Sin red no hay driver: el módulo se salta entero y el sistema se queda con
# el camino libre (nouveau), como hoy. La descripción del grupo NVIDIA en
# netinstall.yaml avisa de que hace falta internet.
skip_if_no_internet: true
update_db: true
ignore_update_db_error: true
update_system: false

pacman:
  num_retries: 3
  disable_download_timeout: true
  needed_only: true
