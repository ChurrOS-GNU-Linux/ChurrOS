---
dontChroot: false
timeout: 60
verbose: true

script:
  - "-rm -r /etc/mkinitcpio.conf.d/"
  - "rm -f /etc/mkinitcpio.conf.d/archiso.conf"
  - "sed -i 's/^MODULES=(/MODULES=(virtio-gpu vmwgfx bochs-drm qxl /' /etc/mkinitcpio.conf"
  - "-sed -i \"s/PRESETS=('archiso')/PRESETS=('default')/\" /etc/mkinitcpio.d/linux*.preset"
  - "-sed -i 's|archiso_config=.*|default_config=\"/etc/mkinitcpio.conf\"|' /etc/mkinitcpio.d/linux*.preset"
  - "-sed -i 's|archiso_image=|default_image=|' /etc/mkinitcpio.d/linux*.preset"
  - "-rm -f /boot/vmlinuz-linux-churrosvyper /boot/initramfs-linux-churrosvyper*.img /etc/mkinitcpio.d/linux-churrosvyper.preset"
  - "if [ -f /boot/vmlinuz-linux-cachyos ]; then rm -f /boot/vmlinuz-linux /boot/initramfs-linux*.img /etc/mkinitcpio.d/linux.preset; elif [ -f /boot/vmlinuz-linux ] && [ ! -f /boot/vmlinuz-linux-cachyos ]; then rm -f /boot/initramfs-linux-cachyos*.img /etc/mkinitcpio.d/linux-cachyos.preset; fi"
  - "mkinitcpio -P"

