---
dontChroot: false
timeout: 30
verbose: true

script:
  - "-rm -r /etc/mkinitcpio.conf.d/"
  - "rm -f /etc/mkinitcpio.conf.d/archiso.conf"
  - "sed -i 's/^MODULES=(/MODULES=(virtio-gpu vmwgfx bochs-drm qxl /' /etc/mkinitcpio.conf"
  # Cada preset de kernel (linux, linux-cachyos y linux-churrosvyper) pasa de archiso a default.
  # Sin variables de shell: Calamares expande todo `$` (un `$p` es "Missing
  # variables" y aborta la instalación).
  - "sed -i -e \"s/PRESETS=('archiso')/PRESETS=('default')/\" -e 's|archiso_config=.*|default_config=\"/etc/mkinitcpio.conf\"|' -e 's|archiso_image=|default_image=|' /etc/mkinitcpio.d/linux*.preset"

