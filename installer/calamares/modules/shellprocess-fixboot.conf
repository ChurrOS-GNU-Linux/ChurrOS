---
dontChroot: false
timeout: 30
verbose: true

script:
  - "-rm -r /etc/mkinitcpio.conf.d/"
  - "rm -f /etc/mkinitcpio.conf.d/archiso.conf"
  # Drivers DRM de máquinas virtuales en el initramfs. El "?" hace que
  # mkinitcpio no falle si el kernel no trae el módulo: un nombre ausente en
  # MODULES aborta la instalación (bochs-drm ya no existe; ahora es bochs).
  - "sed -i 's/^MODULES=(/MODULES=(virtio-gpu? vmwgfx? bochs? qxl? /' /etc/mkinitcpio.conf"
  # Cada preset de kernel (linux, linux-cachyos y linux-churrosvyper) pasa de archiso a default.
  # Sin variables de shell: Calamares expande todo `$` (un `$p` es "Missing
  # variables" y aborta la instalación).
  - "sed -i -e \"s/PRESETS=('archiso')/PRESETS=('default')/\" -e 's|archiso_config=.*|default_config=\"/etc/mkinitcpio.conf\"|' -e 's|archiso_image=|default_image=|' /etc/mkinitcpio.d/linux*.preset"
  - "[ ! -f /etc/mkinitcpio.d/linux-cachyos.preset ] || [ -f /boot/vmlinuz-linux-cachyos ] || ( mv /boot/vmlinuz-linux /boot/vmlinuz-linux-cachyos && ln -sfn vmlinuz-linux-cachyos /boot/vmlinuz-linux )"
  - "[ ! -f /etc/mkinitcpio.d/linux-cachyos.preset ] || ln -sfn initramfs-linux-cachyos.img /boot/initramfs-linux.img"
  - "[ ! -f /etc/mkinitcpio.d/linux-churrosvyper.preset ] || [ -f /boot/vmlinuz-linux-churrosvyper ] || ( mv /boot/vmlinuz-linux /boot/vmlinuz-linux-churrosvyper && ln -sfn vmlinuz-linux-churrosvyper /boot/vmlinuz-linux )"
  - "[ ! -f /etc/mkinitcpio.d/linux-churrosvyper.preset ] || ln -sfn initramfs-linux-churrosvyper.img /boot/initramfs-linux.img"

