---
dontChroot: false
timeout: 60
verbose: true

script:
  - "-rm -rf /etc/mkinitcpio.conf.d/"
  - "rm -f /etc/mkinitcpio.conf.d/archiso.conf"
  - "sed -i 's/^MODULES=(/MODULES=(virtio-gpu vmwgfx bochs-drm qxl /' /etc/mkinitcpio.conf"
  - "[ -f /boot/vmlinuz-linux-cachyos ] || cp -a --remove-destination /boot/vmlinuz-linux /boot/vmlinuz-linux-cachyos"
  - "rm -f /boot/vmlinuz-linux /boot/initramfs-linux.img /boot/initramfs-linux-fallback.img"
  - "rm -f /boot/vmlinuz-linux-churrosvyper /boot/initramfs-linux-churrosvyper*.img /etc/mkinitcpio.d/linux-churrosvyper.preset /etc/mkinitcpio.d/linux.preset"
  - "printf '# mkinitcpio preset file for the linux-cachyos package\\nALL_config=\"/etc/mkinitcpio.conf\"\\nALL_kver=\"/boot/vmlinuz-linux-cachyos\"\\n\\nPRESETS=(\\x27default\\x27)\\n\\ndefault_config=\"/etc/mkinitcpio.conf\"\\ndefault_image=\"/boot/initramfs-linux-cachyos.img\"\\n' > /etc/mkinitcpio.d/linux-cachyos.preset"

