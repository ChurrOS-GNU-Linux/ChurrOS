---
dontChroot: false
timeout: 30
verbose: true

script:
  - "-rm -r /etc/mkinitcpio.conf.d/"
  - "rm -f /etc/mkinitcpio.conf.d/archiso.conf"
  - "sed -i 's/^MODULES=(/MODULES=(virtio-gpu vmwgfx bochs-drm qxl /' /etc/mkinitcpio.conf"
  - "for p in /etc/mkinitcpio.d/linux*.preset; do [ -f \"$p\" ] || continue; sed -i \"s/PRESETS=('archiso')/PRESETS=('default')/\" \"$p\"; sed -i 's|archiso_config=.*|default_config=\"/etc/mkinitcpio.conf\"|' \"$p\"; sed -i 's|archiso_image=|default_image=|' \"$p\"; done"
