---
dontChroot: false
timeout: 30
verbose: true

script:
  - "-rm -r /etc/mkinitcpio.conf.d/"
  - "rm -f /etc/mkinitcpio.conf.d/archiso.conf"
  # Drivers DRM de máquinas virtuales en el initramfs. El "?" hace que
  # mkinitcpio no falle si el kernel no trae el módulo: un nombre ausente en
  # MODULES aborta la instalación (bochs-drm ya no existe; ahora es bochs).
  - "sed -i 's/^MODULES=(/MODULES=(virtio-gpu? vmwgfx? bochs? qxl? /' /etc/mkinitcpio.conf"
  - "sed -i \"s/PRESETS=('archiso')/PRESETS=('default')/\" /etc/mkinitcpio.d/linux.preset"
  - "sed -i 's|archiso_config=.*|default_config=\"/etc/mkinitcpio.conf\"|' /etc/mkinitcpio.d/linux.preset"
  - "sed -i 's|archiso_image=|default_image=|' /etc/mkinitcpio.d/linux.preset"
