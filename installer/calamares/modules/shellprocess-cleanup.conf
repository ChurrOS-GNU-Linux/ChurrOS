---
dontChroot: false
timeout: 30
verbose: false

script:
  - command: "rm -rf /var/cache/pacman/pkg/*"
    timeout: 30
  - command: "rm -f /etc/sudoers.d/churros"
    timeout: 5
  - command: "-cp /etc/os-release /usr/lib/os-release"
    timeout: 5
  - command: "echo 'ChurrOS instalado correctamente.' > /etc/motd"
    timeout: 5
  - command: "rm -rf /usr/bin/calamares /usr/lib/calamares /usr/share/calamares /usr/share/applications/calamares.desktop /etc/calamares"
    timeout: 10
  - command: "rm -f /usr/share/polkit-1/actions/io.calamares.calamares.policy /usr/share/polkit-1/rules.d/49-calamares.rules /etc/polkit-1/rules.d/49-calamares.rules"
    timeout: 5
  - command: "rm -f /etc/ssh/sshd_config.d/10-archiso.conf"
    timeout: 5
  - command: "-rm -f /etc/ssh/ssh_host_*"
    timeout: 5
  - command: "-sed -i '/churros-welcome/d' /etc/skel/.config/niri/config.kdl /home/*/.config/niri/config.kdl"
    timeout: 5
  - command: "-rm -f /etc/skel/.config/autostart/churros-welcome.desktop /home/*/.config/autostart/churros-welcome.desktop"
    timeout: 5
  # Conservar el lanzador de Niri y churros-tour.desktop para el primer inicio.
  # XFCE/KDE usan el .desktop XDG; Niri comprueba ese mismo archivo desde su config.
  # Solo Finalizar tras completar el Tour desactiva el inicio si el usuario lo elige.
  # Cerrar antes de terminar o fallar la instalación conserva el reintento.
  - command: "-userdel -r churros"
    timeout: 10
  - command: "-rm -rf /root/scripts /root/branding /root/packages /root/customize_airootfs.sh /root/.automated_script.sh /root/.zlogin /root/.gnupg"
    timeout: 10
  - command: "-test -x /usr/bin/wal && wal -q -i /usr/share/churros/wallpapers/default.png"
    timeout: 30
  - command: "awk 'BEGIN{s=0} /^\\[churros\\]$/{s=1; next} /^\\[/{s=0} !s' /etc/pacman.conf > /tmp/pacman.conf && mv /tmp/pacman.conf /etc/pacman.conf && sed -i '/^#\\[multilib\\]/,/^#Include/ s/^#//' /etc/pacman.conf"
    timeout: 5
  - command: "mkdir -p /usr/share/plymouth/themes/churros && printf '[Plymouth Theme]\nName=ChurrOS\nDescription=ChurrOS Boot Splash\nModuleName=text\n' > /usr/share/plymouth/themes/churros/churros.plymouth"
    timeout: 5
  - command: "-plymouth-set-default-theme -R churros || plymouth-set-default-theme -R text"
    timeout: 60
  - command: "-/usr/share/churros/scripts/configure-greetd-session"
    timeout: 10
  - command: "-/usr/share/churros/scripts/configure-server"
    timeout: 300
  # El Live mascara estos servicios para arrancar rápido; restablecer la espera
  # de red/tiempo en el sistema instalado, que usa NetworkManager + resolved.
  - command: "-systemctl unmask NetworkManager-wait-online.service systemd-networkd-wait-online.service systemd-time-wait-sync.service"
    timeout: 10
  - command: "-systemctl enable NetworkManager-wait-online.service"
    timeout: 10
  - command: "-systemctl disable systemd-networkd-wait-online.service"
    timeout: 10
  - command: "-rm -f /etc/systemd/network/20-ethernet.network /etc/systemd/network/20-wlan.network /etc/systemd/network/20-wwan.network /etc/systemd/networkd.conf.d/ipv6-privacy-extensions.conf /etc/systemd/system/systemd-networkd-wait-online.service.d/wait-for-only-one-interface.conf /etc/systemd/system/dbus-org.freedesktop.network1.service"
    timeout: 10
  - command: "-/usr/share/churros/scripts/verify-install"
    timeout: 60
  - command: "-/usr/share/churros/scripts/configure-greeter-locale"
    timeout: 10
  - command: "-sed -i '/set superusers=/d' /boot/grub/grub.cfg"
    timeout: 5
  - command: "-sed -i '/password_pbkdf2/d' /boot/grub/grub.cfg"
    timeout: 5
    timeout: 5
